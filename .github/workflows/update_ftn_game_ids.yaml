on:
  schedule:
    # every six hours, offset from Update FTN Data
    - cron: '37 */6 * 9-12,1-2 *'
  workflow_dispatch:

name: Update FTN Game IDs

permissions:
  contents: read

jobs:
  update_ftn_game_ids:
    name: Update FTN game IDs
    runs-on: ubuntu-latest
    # R + all dependencies preinstalled, see https://github.com/nflverse/actions
    container: ghcr.io/nflverse/r-runner:latest
    steps:
      # Checkout + nflverse packages at their latest commit + DESCRIPTION deps
      - uses: nflverse/actions/setup@v1
        with:
          packages: nflverse/nflverse-data nflverse/nflreadr

      # write to the raw release here only.
      # Minted after setup, which installs unpinned GitHub code.
      - id: upload-token
        uses: nflverse/actions/app-token@v1
        with:
          client-id: ${{ vars.NFLVERSE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NFLVERSE_APP_PRIVATE_KEY }}
          repositories: nflverse-ftn
          contents: write

      - name: Update FTN game IDs
        run: Rscript exec/update_ftn_games.R
        env:
          # gh cli (nflversedata uploads) and piggyback
          GH_TOKEN: ${{ steps.upload-token.outputs.token }}
          GITHUB_PAT: ${{ steps.upload-token.outputs.token }}
          FTN_API_KEY: ${{ secrets.FTN_API_KEY }}
          FTN_NFLVERSE_ENDPOINT: ${{ secrets.FTN_NFLVERSE_ENDPOINT }}
