# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  workflow_dispatch:
    inputs:
      season_rebuild:
        description: 'Rebuild Season (9999 defaults to latest season). Do multiple seasons comma separated, e.g. 2017,2019,2021'
        required: false
        default: 9999
        type: number
      full_rebuild:
        description: 'Full Rebuild (overwrites above season)'
        required: true
        default: false
        type: boolean

name: Update FTN Participation

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    name: setup
    outputs:
      seasons: ${{ steps.seasons.outputs.seasons }}
    steps:
      - id: seasons
        uses: nflverse/actions/season-matrix@v1
        with:
          first-season: 2023
          season-rebuild: ${{ inputs.season_rebuild }}
          full-rebuild: ${{ inputs.full_rebuild }}

  update_ftn_partcipation:
    needs: setup
    name: Update ${{ matrix.season }} ${{ matrix.type }}
    runs-on: ubuntu-latest
    # R + all dependencies preinstalled, see https://github.com/nflverse/actions
    container: ghcr.io/nflverse/r-runner:latest
    strategy:
      fail-fast: false
      matrix:
        season: ${{ fromJson(needs.setup.outputs.seasons) }}
        type: ["participation"]
    env:
      NFLVERSE_UPDATE_SEASON: ${{ matrix.season }}
      NFLVERSE_UPDATE_TYPE: ${{ matrix.type }}
    steps:
      # Checkout + nflverse packages at their latest commit + this package
      # (the script calls nflverseftn::)
      - uses: nflverse/actions/setup@v1
        with:
          packages: nflverse/nflverse-data nflverse/nflreadr
          install-local: true

      # write to pbp_participation in nflverse-data only. Minted after setup,
      # which installs unpinned GitHub code.
      - id: upload-token
        uses: nflverse/actions/app-token@v1
        with:
          client-id: ${{ vars.NFLVERSE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NFLVERSE_APP_PRIVATE_KEY }}
          repositories: nflverse-data
          contents: write

      - name: Release ${{ matrix.type }}
        run: Rscript exec/update_ftn_participation.R
        env:
          # gh cli (nflversedata uploads) and piggyback
          GH_TOKEN: ${{ steps.upload-token.outputs.token }}
          GITHUB_PAT: ${{ steps.upload-token.outputs.token }}
          FTN_API_KEY: ${{ secrets.FTN_API_KEY }}
          FTN_NFLVERSE_ENDPOINT: ${{ secrets.FTN_NFLVERSE_ENDPOINT }}
